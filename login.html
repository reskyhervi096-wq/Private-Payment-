
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f5f3">
    <title>Login — Private Payment</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f5f3;
            color: #171717;
            font-family: Arial, sans-serif;
        }

        .page {
            max-width: 480px;
            min-height: 100vh;
            margin: auto;
            padding: 30px 25px;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 22px;
            border-bottom: 1px solid #dededb;
        }

        .brand {
            font-size: 23px;
            font-weight: 700;
            letter-spacing: -1.5px;
        }

        .brand span {
            color: #7566b5;
        }

        .label {
            font-size: 9px;
            letter-spacing: 1.8px;
            color: #888;
        }

        main {
            margin-top: 75px;
        }

        .eyebrow {
            font-size: 10px;
            letter-spacing: 2px;
            color: #858585;
            margin-bottom: 17px;
        }

        h1 {
            font-size: 43px;
            letter-spacing: -2px;
        }

        .description {
            color: #777;
            font-size: 13px;
            margin-top: 12px;
            line-height: 1.7;
        }

        form {
            margin-top: 40px;
        }

        .field {
            margin-bottom: 23px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            height: 53px;
            padding: 0 15px;
            background: transparent;
            border: 1px solid #d5d5d1;
            border-radius: 3px;
            outline: none;
            font-size: 13px;
            color: #171717;
        }

        input:focus {
            border-color: #7566b5;
        }

        .submit {
            width: 100%;
            height: 56px;
            background: #171717;
            color: white;
            border: none;
            font-size: 13px;
            font-weight: 600;
            margin-top: 10px;
            cursor: pointer;
        }

        .submit:disabled {
            opacity: 0.55;
            cursor: wait;
        }

        .back {
            display: block;
            margin-top: 25px;
            text-align: center;
            color: #777;
            font-size: 12px;
            text-decoration: none;
        }

        footer {
            margin-top: auto;
            padding-top: 35px;
            border-top: 1px solid #dededb;
            color: #888;
            font-size: 9px;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

<div class="page">

    <header>
        <div class="brand">private<span>.</span></div>
        <div class="label">PAYMENT PLATFORM</div>
    </header>

    <main>
        <div class="eyebrow">ACCOUNT ACCESS / 01</div>

        <h1>Sign in.</h1>

        <p class="description">
            Enter your account details to continue.
        </p>

        <form id="loginForm">

            <div class="field">
                <label for="email">Email address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="name@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="field">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button class="submit" type="submit">
                CONTINUE →
            </button>

        </form>

        <a class="back" href="index.html">
            ← Back to home
        </a>
    </main>

    <footer>
        PRIVATE PAYMENT
    </footer>

</div>

<script>
    // TELEGRAM MINI APP
    const tg = window.Telegram?.WebApp;

    if (tg) {
        tg.ready();
        tg.expand();

        tg.BackButton.show();

        tg.BackButton.onClick(() => {
            window.location.href = "index.html";
        });
    }

    // BACKEND CONFIGURATION
    const API_BASE_URL = "http://127.0.0.1:3000";

    // LOGIN FORM
    const loginForm = document.getElementById("loginForm");

    loginForm.addEventListener("submit", async function(event) {
        event.preventDefault();

        const email = document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase();

        const password = document
            .getElementById("password")
            .value;

        const button = loginForm.querySelector(".submit");

        button.disabled = true;
        button.textContent = "SIGNING IN...";

        try {
            const response = await fetch(
                API_BASE_URL + "/auth/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                }
            );

            const result = await response.json();

            if (!response.ok || result.status !== "SUCCESS") {
                throw new Error(
                    result.message || "Login failed."
                );
            }

            const accessToken = result.session?.access_token;

            if (!accessToken) {
                throw new Error(
                    "Access token was not received."
                );
            }

            // SAVE ACCESS TOKEN
            sessionStorage.setItem(
                "private_payment_token",
                accessToken
            );

            alert("Login successful!");

            // TEMPORARY REDIRECT
            window.location.href = "index.html";

        } catch (error) {
            alert(
                error.message ||
                "Unable to connect to server."
            );

        } finally {
            button.disabled = false;
            button.textContent = "CONTINUE →";
        }
    });
</script>

</body>
</html>
