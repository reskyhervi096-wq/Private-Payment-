
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — PRIVATE.</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f3;
            color: #171717;
            min-height: 100vh;
            padding: 28px 22px;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
        }

        .brand {
            font-size: 25px;
            font-weight: 700;
            letter-spacing: -1.5px;
        }

        .subtitle {
            font-size: 10px;
            letter-spacing: 2px;
            color: #777;
            margin-top: 5px;
        }

        .content {
            margin-top: 75px;
        }

        .eyebrow {
            font-size: 11px;
            letter-spacing: 2px;
            color: #7566b5;
            margin-bottom: 14px;
        }

        h1 {
            font-size: 34px;
            letter-spacing: -1.5px;
            margin-bottom: 12px;
        }

        .description {
            color: #777;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 38px;
        }

        .field {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-size: 12px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 15px 0;
            border: none;
            border-bottom: 1px solid #d5d5d2;
            background: transparent;
            outline: none;
            font-size: 15px;
            color: #171717;
        }

        input:focus {
            border-bottom-color: #7566b5;
        }

        input::placeholder {
            color: #aaa;
        }

        .submit {
            width: 100%;
            padding: 17px;
            margin-top: 18px;
            background: #171717;
            color: white;
            border: none;
            font-size: 12px;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .submit:disabled {
            opacity: 0.5;
        }

        .bottom {
            margin-top: 28px;
            text-align: center;
            font-size: 13px;
            color: #777;
        }

        a {
            color: #171717;
            text-decoration: none;
            font-weight: 600;
        }

        .footer {
            margin-top: 65px;
            font-size: 10px;
            letter-spacing: 1px;
            color: #aaa;
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <div class="brand">private.</div>
            <div class="subtitle">PAYMENT PLATFORM</div>
        </header>

        <main class="content">

            <div class="eyebrow">ACCOUNT REGISTRATION</div>

            <h1>Create account.</h1>

            <p class="description">
                Create your account to get started with PRIVATE PAYMENT.
            </p>

            <form id="registerForm">

                <div class="field">
                    <label for="name">FULL NAME</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <div class="field">
                    <label for="email">EMAIL ADDRESS</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="field">
                    <label for="password">PASSWORD</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Minimum 8 characters"
                        minlength="8"
                        required
                    >
                </div>

                <div class="field">
                    <label for="confirmPassword">CONFIRM PASSWORD</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Enter password again"
                        required
                    >
                </div>

                <button type="submit" class="submit">
                    CREATE ACCOUNT →
                </button>

            </form>

            <div class="bottom">
                Already have an account?
                <a href="login.html">Login</a>
            </div>

        </main>

        <div class="footer">
            PRIVATE PAYMENT © 2026
        </div>

    </div>

    <script>
        const tg = window.Telegram?.WebApp;

        if (tg) {
            tg.ready();
            tg.expand();

            tg.BackButton.show();

            tg.BackButton.onClick(() => {
                window.location.href = "index.html";
            });
        }

        const API_BASE_URL = "http://127.0.0.1:3000";

        const form = document.getElementById("registerForm");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim().toLowerCase();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            const button = form.querySelector(".submit");

            if (password !== confirmPassword) {
                alert("Passwords do not match.");
                return;
            }

            if (password.length < 8) {
                alert("Password must contain at least 8 characters.");
                return;
            }

            button.disabled = true;
            button.textContent = "CREATING ACCOUNT...";

            try {
                const response = await fetch(
                    API_BASE_URL + "/auth/register",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            display_name: name,
                            email: email,
                            password: password
                        })
                    }
                );

                const result = await response.json();

                if (!response.ok || result.status !== "SUCCESS") {
                    throw new Error(
                        result.message || "Registration failed."
                    );
                }

                if (result.confirmation_required) {
                    alert(
                        "Registration successful!\n\n" +
                        "Please check your email to verify your account."
                    );
                } else {
                    alert("Registration successful!");

                    window.location.href = "login.html";
                }

            } catch (error) {
                alert(
                    error.message ||
                    "Unable to connect to server."
                );
            } finally {
                button.disabled = false;
                button.textContent = "CREATE ACCOUNT →";
            }
        });
    </script>

</body>
</html>
