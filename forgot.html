
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f5f3">
    <title>Password Recovery — Private Payment</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f5f3;
            color: #171717;
            font-family: Arial, sans-serif;
        }

        .page {
            max-width: 480px;
            min-height: 100vh;
            margin: auto;
            padding: 30px 25px;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 22px;
            border-bottom: 1px solid #dededb;
        }

        .brand {
            font-size: 23px;
            font-weight: 700;
            letter-spacing: -1.5px;
        }

        .brand span {
            color: #7566b5;
        }

        .label {
            font-size: 9px;
            letter-spacing: 1.8px;
            color: #888;
        }

        main {
            margin-top: 85px;
        }

        .eyebrow {
            font-size: 10px;
            letter-spacing: 2px;
            color: #858585;
            margin-bottom: 17px;
        }

        h1 {
            font-size: 42px;
            letter-spacing: -2px;
        }

        .description {
            color: #777;
            font-size: 13px;
            margin-top: 15px;
            line-height: 1.8;
        }

        form {
            margin-top: 40px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            height: 53px;
            padding: 0 15px;
            background: transparent;
            border: 1px solid #d5d5d1;
            border-radius: 3px;
            outline: none;
            font-size: 13px;
        }

        input:focus {
            border-color: #7566b5;
        }

        button {
            width: 100%;
            height: 56px;
            margin-top: 20px;
            background: #171717;
            color: white;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .back {
            display: block;
            margin-top: 27px;
            text-align: center;
            color: #777;
            font-size: 12px;
            text-decoration: none;
        }

        footer {
            margin-top: auto;
            padding-top: 30px;
            border-top: 1px solid #dededb;
            color: #888;
            font-size: 9px;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

<div class="page">

    <header>
        <div class="brand">private<span>.</span></div>
        <div class="label">PAYMENT PLATFORM</div>
    </header>

    <main>
        <div class="eyebrow">ACCOUNT RECOVERY</div>

        <h1>Forgot password?</h1>

        <p class="description">
            Enter the email address associated with
            your account. We will send you a password
            recovery link.
        </p>

        <form id="forgotForm">

            <label for="email">Email address</label>

            <input
                type="email"
                id="email"
                placeholder="name@example.com"
                autocomplete="email"
                required
            >

            <button type="submit">
                SEND RECOVERY LINK →
            </button>

        </form>

        <a class="back" href="login.html">
            ← Back to login
        </a>
    </main>

    <footer>PRIVATE PAYMENT</footer>

</div>

<script>
    const tg = window.Telegram?.WebApp;

    if (tg) {
        tg.ready();
        tg.expand();
        tg.BackButton.show();

        tg.BackButton.onClick(() => {
            window.location.href = "login.html";
        });
    }

    document.getElementById("forgotForm")
        .addEventListener("submit", function(event) {
            event.preventDefault();

            alert("Password recovery API belum dihubungkan.");
        });
</script>

</body>
</html>
