
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f5f3">

    <title>Private Payment</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f5f3;
            color: #171717;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
        }

        .page {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            margin: auto;
            padding: 30px 25px;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 22px;
            border-bottom: 1px solid #dededb;
        }

        .brand {
            font-size: 23px;
            font-weight: 700;
            letter-spacing: -1.5px;
        }

        .brand span {
            color: #7566b5;
        }

        .brand-label {
            font-size: 9px;
            letter-spacing: 1.8px;
            color: #888;
        }

        main {
            margin-top: 100px;
        }

        .eyebrow {
            font-size: 10px;
            letter-spacing: 2px;
            color: #858585;
            margin-bottom: 17px;
        }

        h1 {
            font-size: 49px;
            line-height: 1.05;
            letter-spacing: -3px;
            font-weight: 600;
        }

        .description {
            margin-top: 18px;
            color: #777;
            font-size: 13px;
            line-height: 1.7;
        }

        .actions {
            margin-top: 55px;
        }

        .action {
            width: 100%;
            height: 61px;
            padding: 0 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #d9d9d5;
            background: transparent;
            color: #171717;
            font-size: 13px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .action.primary {
            background: #171717;
            color: #fff;
            border-color: #171717;
        }

        .number {
            margin-right: 14px;
            color: #888;
            font-size: 11px;
        }

        .primary .number {
            color: #aaa;
        }

        .arrow {
            font-size: 19px;
            font-weight: 400;
        }

        .forgot {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 12px;
            text-decoration: none;
        }

        .forgot:hover {
            color: #171717;
        }

        footer {
            margin-top: auto;
            padding-top: 35px;
            border-top: 1px solid #dededb;
            display: flex;
            justify-content: space-between;
            color: #888;
            font-size: 9px;
            letter-spacing: 1px;
        }

        @media (max-height: 700px) {
            main {
                margin-top: 55px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <header>
        <div class="brand">private<span>.</span></div>
        <div class="brand-label">PAYMENT PLATFORM</div>
    </header>

    <main>

        <div class="eyebrow">
            YOUR ACCOUNT, YOUR CONTROL.
        </div>

        <h1>
            Welcome<br>
            to private.
        </h1>

        <p class="description">
            Your personal digital payment platform.
            Sign in or create an account to continue.
        </p>

        <div class="actions">

            <button class="action primary"
                onclick="navigate('login')">
                <span>
                    <span class="number">01</span>
                    Login
                </span>
                <span class="arrow">↗</span>
            </button>

            <button class="action"
                onclick="navigate('register')">
                <span>
                    <span class="number">02</span>
                    Create account
                </span>
                <span class="arrow">↗</span>
            </button>

            <a class="forgot" href="forgot.html">
                Forgot password?
            </a>

        </div>

    </main>

    <footer>
        <span>PRIVATE PAYMENT</span>
        <span>2026</span>
    </footer>

</div>

<script>
    const tg = window.Telegram?.WebApp;

    if (tg) {
        tg.ready();
        tg.expand();
    }

    function navigate(page) {
        const routes = {
            login: "login.html",
            register: "register.html",
            forgot: "forgot.html"
        };

        if (routes[page]) {
            window.location.href = routes[page];
        }
    }
</script>

</body>
</html>
